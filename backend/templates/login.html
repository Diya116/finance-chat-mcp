{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <div class="actions"><button type="submit">Log in</button></div>
  </form>
  <p>No account yet? <a href="/signup?next={{ (next or '') | urlencode }}">Sign up</a></p>
</div>
{% endblock %}
