{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card">
  <h1>Create account</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email">
    <label for="password">Password (min 8 characters)</label>
    <input id="password" type="password" name="password" minlength="8" required autocomplete="new-password">
    <div class="actions"><button type="submit">Sign up</button></div>
  </form>
  <p>Already have an account? <a href="/login?next={{ (next or '') | urlencode }}">Log in</a></p>
</div>
{% endblock %}
