<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance Chat{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#667085; --line:#e4e7ec;
            --brand:#2f6fed; --good:#12805c; --bad:#c0362c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151c; --card:#1b2029; --text:#e8ebf2; --muted:#98a2b3; --line:#2b3240;
              --brand:#6d9bff; --good:#3ecf9a; --bad:#ff7b72; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center;
             padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
    header a.logo { font-weight:700; color:var(--text); text-decoration:none; }
    main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:20px; margin-bottom:16px; }
    h1 { font-size:1.6rem; margin:.2em 0 .4em; } h2 { font-size:1.1rem; margin:0 0 .6em; }
    p, li { color:var(--muted); } label { display:block; margin:12px 0 4px; font-weight:600; font-size:.9rem; }
    input[type=email], input[type=password] { width:100%; padding:10px 12px; font-size:1rem;
      border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
    button, .btn { display:inline-block; padding:10px 18px; font-size:1rem; border-radius:8px; cursor:pointer;
      border:1px solid var(--brand); background:var(--brand); color:#fff; text-decoration:none; }
    button.secondary, .btn.secondary { background:transparent; color:var(--brand); }
    button.danger { background:transparent; color:var(--bad); border-color:var(--bad); padding:4px 10px; font-size:.85rem; }
    button.link { background:none; border:none; color:var(--muted); padding:0; }
    table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:.85rem; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .error { background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad);
             padding:10px 12px; border-radius:8px; margin-bottom:8px; }
    .over { color:var(--bad); font-weight:600; } .ok { color:var(--good); }
    code, .copy { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:2px 6px;
                  word-break:break-all; font-family:ui-monospace, Consolas, monospace; font-size:.9rem; }
    .actions { display:flex; gap:10px; margin-top:16px; } form.inline { display:inline; }
    .big { font-size:2rem; font-weight:700; color:var(--text); }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">💬 Finance Chat</a>
    {% if user %}
      <form class="inline" method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <span style="color:var(--muted)">{{ user.email }}</span> &nbsp;
        <button class="link" type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
